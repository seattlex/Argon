# Argon OS — /etc/default/grub for the installed system.
# Merges these keys into the target's existing /etc/default/grub (overwrite:
# false) before GRUB's config is generated. Carries Argon's branding and the
# AppArmor kernel command line onto installed systems (the live session gets
# it via the boot menu; installed systems get it here).
---
overwrite: false
defaults:
  GRUB_TIMEOUT: 5
  GRUB_TIMEOUT_STYLE: "menu"
  GRUB_DISTRIBUTOR: "Argon OS"
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash apparmor=1 security=apparmor"
  GRUB_CMDLINE_LINUX: ""
  GRUB_DISABLE_OS_PROBER: false
