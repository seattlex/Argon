# Argon OS — keyboard defaults.
#
# Sensible starting point; the keyboard page lets the user pick any layout
# and test it in a preview field before continuing.
---
keyboardLayout: "us"
keyboardVariant: ""

# Write the choice to the installed system the standard Debian way.
xOrgConfFileName: "00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
