# Argon OS — remove live-only bits from the installed system.
# Runs in the target after packages. Together with the removeuser module
# (which deletes the live 'argon' account) this makes the installed system
# a normal, login-required system with only the account you created.
---
dontChroot: false
timeout: 30
script:
  - "rm -f /etc/lightdm/lightdm.conf.d/60-argon-autologin.conf"
  - "rm -f /usr/share/applications/install-argon.desktop"
  - "rm -f /etc/live/config.conf"
