# Argon OS — welcome page: requirement checks and helpful links.
---
# Links shown on the welcome page (URLs come from branding.desc).
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: true
showDonateUrl:       false

requirements:
  # Roomy enough for the desktop; the Security Edition needs more but the
  # installer doesn't hard-block on it.
  requiredStorage:    12.0
  requiredRam:        1.8
  # No internet requirement, and — importantly — no network ping: an empty
  # URL disables the connectivity check entirely, so the installer never
  # reaches out. Argon installs fully offline.
  internetCheckUrl:   ""
  check:
    - storage
    - ram
    - power
    - screen
    - root
  # Only storage/RAM/root actually block installation; power and screen are
  # advisory warnings.
  required:
    - storage
    - ram
    - root
