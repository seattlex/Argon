# Argon OS — GRUB bootloader installation (BIOS + UEFI)
#
# This file MUST exist: Calamares' bootloader module reads these binary names
# and the EFI id straight out of its configuration (e.g. configuration
# ["grubInstall"] on the BIOS path, ["efiBootloaderId"] on the EFI path). With
# no config file the module raises a KeyError — surfaced by the installer as
# "Main script file .../bootloader/main.py ... raised an exception".
---
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Name shown in the UEFI firmware boot menu and the GRUB entry.
efiBootloaderId: "Argon"
bootloaderEntryName: "Argon OS"

# Also drop GRUB into the removable-media fallback path
# (\EFI\BOOT\bootx64.efi) so it boots on firmware that ignores NVRAM entries.
installEFIFallback: true
