# Argon OS — target filesystem mounts during install.
#
# Shipped explicitly (rather than relying on the calamares package default)
# so the target chroot always has a complete environment for grub-install,
# grub-mkconfig, update-initramfs and package hooks. Mirrors the upstream
# defaults plus /dev/pts, which the packaged config omits.
---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: devpts
    fs: devpts
    mountPoint: /dev/pts
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# btrfs roots get the usual subvolume split (matches upstream defaults).
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log
