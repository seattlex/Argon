# Argon OS — partitioning defaults
# Full-disk encryption is the promoted default: the "erase disk" choice
# pre-selects LUKS and the user only picks a passphrase.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

userSwapChoices:
  - none
  - small
  - suspend
  - file

initialPartitioningChoice: erase
initialSwapChoice: small

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

# LUKS2 for new encrypted installs
luksGeneration: luks2
enableLuksAutomatedPartitioning: true

allowManualPartitioning: true
armInstall: false
