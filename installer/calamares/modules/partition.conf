# Argon OS — partitioning defaults
# Full-disk encryption is the promoted default: the "erase disk" choice
# pre-selects LUKS and the user only picks a passphrase.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

userSwapChoices:
  - none
  - small
  - suspend
  - file

initialPartitioningChoice: erase
initialSwapChoice: small

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

# LUKS2 for new encrypted installs
luksGeneration: luks2
enableLuksAutomatedPartitioning: true

# Automated (erase-disk) layout: a separate UNENCRYPTED ext4 /boot, then
# root on the user-chosen filesystem. This is the same scheme Fedora/Ubuntu
# use, and it is what makes the bootloader step reliable:
#  * GRUB never has to read an encrypted volume — grub-install works the
#    same on plain and LUKS installs, BIOS and UEFI alike;
#  * LUKS2 (argon2id) stays kernel/initramfs territory, where it is
#    actually supported — GRUB cannot unlock LUKS2/argon2id, so an
#    encrypted /boot would be unbootable even when the install succeeds;
#  * /boot is ext4 regardless of a btrfs root, the most compatible thing
#    to point a bootloader at.
# noEncrypt keeps /boot in the clear when the user enables encryption.
# (Calamares adds the platform boot partitions — ESP on UEFI — by itself,
# and defaults the table to GPT on UEFI / MBR on BIOS.)
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    noEncrypt: true
    size: 1024M
  - name: "argon-root"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%

allowManualPartitioning: true
armInstall: false
