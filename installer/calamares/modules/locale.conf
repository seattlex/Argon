# Argon OS — locale defaults.
#
# No geoip. Calamares can guess your location by querying a web service;
# Argon never does — that would phone out before you've even installed.
# Omitting the `geoip:` block disables it. You pick your region/timezone on
# the locale page; the values below are only the starting point (Argon is
# developed in Norway), and the map is fully interactive.
---
region: "Europe"
zone:   "Oslo"

# Where locale.gen lives on the target (Debian/Kali default).
localeGenPath: "/etc/locale.gen"
