# Argon OS — network privacy defaults

[device]
# Use a fully random MAC address while scanning for Wi-Fi networks,
# so the device cannot be tracked between locations while idle.
wifi.scan-rand-mac-address=yes

[connection]
# Use a per-network "stable" random MAC once connected: unique per SSID
# (prevents cross-network tracking) but stable within one network
# (keeps captive portals and DHCP reservations working).
# Change to "random" for a new MAC on every connect.
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable

[ipv4]
# Do not send the hostname to DHCP servers
dhcp-send-hostname=false

[ipv6]
dhcp-send-hostname=false
# IPv6 privacy extensions (RFC 4941): prefer temporary addresses
ip6-privacy=2

[main]
# Hand DNS to systemd-resolved, which enforces DNS-over-TLS (see
# /etc/systemd/resolved.conf.d/argon-dns.conf)
dns=systemd-resolved
