# Argon OS — authenticated time synchronisation
#
# Plain NTP is trivially spoofable, and wrong system time breaks TLS
# certificate validation. Argon uses Network Time Security (NTS, RFC 8915):
# the time responses below are cryptographically authenticated.

server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts

# Keep NTS cookies across reboots so cold boots resync quickly
ntsdumpdir /var/lib/chrony

# Step the clock on boot if it is badly wrong, then slew only
makestep 1.0 3

# Never act as a time server for others
port 0
cmdport 0
