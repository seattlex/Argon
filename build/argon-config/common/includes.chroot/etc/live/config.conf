# Argon OS — live-config settings.
#
# Argon bakes its live 'argon' user (with a real password and groups) into
# the image at build time, and configures autologin statically. So we tell
# live-config NOT to run its own user/password/sudo setup — that boot-time
# handling is exactly what previously left the account locked and every
# autologin failing with "authentication failure". Everything else
# live-config does (locale, keyboard, etc.) still runs normally.
#
# No-op on installed systems (live-config only runs in a live session).
LIVE_CONFIG_NOCOMPONENTS="user-setup sudo passwd"
