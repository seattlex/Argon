# Argon OS — night-light (blue-light filter) defaults for redshift-gtk.
#
# Uses a MANUAL location (not geoclue) on purpose: automatic geolocation
# would query a network location service, which a privacy-first OS should
# not do by default. Set your own latitude/longitude below — the default
# is Oslo, Norway. Positive lat = north, positive lon = east.
#
# Adjust temperatures to taste (higher = cooler/bluer, lower = warmer).

[redshift]
temp-day=6500
temp-night=3800
brightness-day=1.0
brightness-night=0.9
transition=1
adjustment-method=randr
location-provider=manual

[manual]
lat=59.91
lon=10.75
