# Argon OS — initramfs policy for booting off real removable media.
#
# MODULES=most is the Debian default, but it is set in
# /etc/initramfs-tools/initramfs.conf, which is a conffile owned by
# initramfs-tools: a package update, or any base image that ships
# MODULES=dep, silently turns the live image into something that only
# boots on the machine it was built on. Pinning it here (conf.d sorts
# after initramfs.conf) makes the guarantee explicit and survives
# upstream changes.
#
# The symptom when this is wrong: the boot splash runs for a while, then
# live-boot gives up looking for the live filesystem and panics into a
# BusyBox "(initramfs)" prompt. It reproduces on physical USB boots while
# working perfectly in a VM, because a VM's disk uses drivers that are
# present either way.
MODULES=most
