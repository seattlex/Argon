# Argon OS — SSH server hardening
# Note: sshd is installed but DISABLED by default (see the argon-services
# hook). Enable it explicitly with:  sudo systemctl enable --now ssh

# No root logins, ever; use a regular user plus sudo
PermitRootLogin no

# Keys only — password authentication is disabled by default.
# If you must use passwords on a trusted network, override in a later file.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Reduce brute-force surface
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30

# No forwarding surprises
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local

# Drop dead connections quickly
ClientAliveInterval 300
ClientAliveCountMax 2

# Modern cryptography only
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

# Don't leak version details in logs to remote parties more than needed
DebianBanner no
