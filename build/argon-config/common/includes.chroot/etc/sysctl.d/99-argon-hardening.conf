# Argon OS — kernel hardening defaults
# These are applied on every boot. Overrides go in a file sorting later in
# /etc/sysctl.d/ (e.g. 99-local.conf edited by the administrator).

## Kernel self-protection
# Hide kernel pointers from unprivileged users (2 = hide even from root)
kernel.kptr_restrict = 2
# Restrict dmesg to root; kernel logs leak addresses and hardware details
kernel.dmesg_restrict = 1
# Disable the SysRq key except for sync/remount/reboot (safe subset)
kernel.sysrq = 176
# Forbid unprivileged eBPF and harden the BPF JIT against spraying
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# ptrace only on descendants (Yama); debuggers still work on own children
kernel.yama.ptrace_scope = 1
# Disable kexec: a compromised root cannot hot-swap the running kernel
kernel.kexec_load_disabled = 1
# Panic instead of continuing on kernel oops in unclear state
kernel.panic_on_oops = 1

## Note on user namespaces:
## kernel.unprivileged_userns_clone stays ENABLED (Debian default) because
## browser and Flatpak sandboxes depend on it. Restricting it would weaken
## application sandboxing, which matters more on a desktop system.

## Memory protections
# Refuse to map the first 64k of memory (mitigates NULL-deref exploits)
vm.mmap_min_addr = 65536
# More ASLR entropy for mmap allocations
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16
# Restrict userfaultfd to privileged users (used in heap exploitation)
vm.unprivileged_userfaultfd = 0

## Filesystem protections
# Refuse to follow unsafe links / open unsafe FIFOs+regular files in
# world-writable sticky directories
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Do not include the SUID binary's memory in coredumps
fs.suid_dumpable = 0

## Network — spoofing and redirect protection
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

## Network — TCP/ICMP behaviour
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Disable TCP timestamps: they leak uptime and aid fingerprinting
net.ipv4.tcp_timestamps = 0

## Not a router
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
