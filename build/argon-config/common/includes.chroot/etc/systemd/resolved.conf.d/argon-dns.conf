# Argon OS — encrypted DNS by default
#
# All DNS traffic goes over TLS (RFC 7858) to privacy-respecting resolvers:
#   Quad9 (primary)      — Switzerland, no logging, malware blocking
#   Mullvad (fallback)   — Sweden, no logging
#
# To change resolvers, drop a file after this one in
# /etc/systemd/resolved.conf.d/ or edit per-connection DNS in NetworkManager.
# DNSSEC runs in allow-downgrade mode so broken networks still resolve;
# set DNSSEC=yes for strict validation.

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=194.242.2.2#dns.mullvad.net
DNSOverTLS=yes
DNSSEC=allow-downgrade
# Never fall back to unencrypted multicast protocols that announce the
# hostname on the local network
MulticastDNS=no
LLMNR=no
Cache=yes
