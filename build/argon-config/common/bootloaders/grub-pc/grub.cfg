## Argon OS — GRUB boot menu (UEFI boot)
## live-build uses this as the EFI grub menu. Entries match the isolinux
## (BIOS) menu so both firmware paths behave identically.

if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm
    terminal_output gfxterm
fi

# Argon theme (dark Nordic); falls back gracefully if assets are absent
if background_image /boot/grub/argon-splash.png ; then
    true
fi
if [ -e /boot/grub/theme/theme.txt ]; then
    set theme=/boot/grub/theme/theme.txt
fi

set default=0
set timeout=10

menuentry "Start Argon OS (live)" {
    linux  /live/vmlinuz boot=live components quiet splash username=argon hostname=argon apparmor=1 security=apparmor
    initrd /live/initrd.img
}

menuentry "Start Argon OS (safe graphics)" {
    linux  /live/vmlinuz boot=live components quiet splash username=argon hostname=argon apparmor=1 security=apparmor nomodeset
    initrd /live/initrd.img
}

menuentry "Start Argon OS (load to RAM, run without the USB)" {
    linux  /live/vmlinuz boot=live components quiet splash username=argon hostname=argon apparmor=1 security=apparmor toram
    initrd /live/initrd.img
}

menuentry "Start Argon OS (failsafe)" {
    linux  /live/vmlinuz boot=live components username=argon hostname=argon noapic noapm nodma nomce nolapic nomodeset nosplash vga=normal
    initrd /live/initrd.img
}
