## Argon OS — isolinux boot menu (BIOS boot)
## live-build merges this over the default Debian live isolinux config.

menu hshift 0
menu width 82
menu title Argon OS
menu tabmsg Press ENTER to boot or TAB to edit a menu entry

# Auto-boot the default entry after 5 seconds (faster boot)
timeout 50
prompt 0

include stdmenu.cfg
include live.cfg
menu clear
