## Argon OS — isolinux live boot entries (BIOS)
## Kernel command line mirrors auto/config's --bootappend-live so a
## BIOS boot gets the same hardened defaults (apparmor) as UEFI.

label live-argon
    menu label ^Start Argon OS (live)
    menu default
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash hostname=argon live-config.hostname=argon apparmor=1 security=apparmor

label live-argon-safe
    menu label Start Argon OS (^safe graphics)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash hostname=argon live-config.hostname=argon apparmor=1 security=apparmor nomodeset

## Diagnostic entry. The default entry's "quiet splash" hides the reason a
## boot failed behind the Plymouth splash, so a machine that cannot reach
## its live filesystem just lands in a BusyBox "(initramfs)" prompt with no
## visible explanation. This entry keeps the kernel and live-boot messages
## on screen so the actual error is readable.
label live-argon-verbose
    menu label Start Argon OS (^verbose — troubleshoot boot)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components hostname=argon live-config.hostname=argon apparmor=1 security=apparmor debug=1 nosplash

label live-argon-failsafe
    menu label Start Argon OS (^failsafe)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components hostname=argon live-config.hostname=argon noapic noapm nodma nomce nolapic nomodeset nosplash vga=normal

label live-argon-toram
    menu label Start Argon OS (load to ^RAM, run without the USB)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash hostname=argon live-config.hostname=argon apparmor=1 security=apparmor toram
