## Argon OS — isolinux live boot entries (BIOS)
## Kernel command line mirrors auto/config's --bootappend-live so a
## BIOS boot gets the same hardened defaults (apparmor) as UEFI.

label live-argon
    menu label ^Start Argon OS (live)
    menu default
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash username=argon hostname=argon live-config.username=argon live-config.hostname=argon apparmor=1 security=apparmor

label live-argon-safe
    menu label Start Argon OS (^safe graphics)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash username=argon hostname=argon live-config.username=argon live-config.hostname=argon apparmor=1 security=apparmor nomodeset

label live-argon-failsafe
    menu label Start Argon OS (^failsafe)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components username=argon hostname=argon live-config.username=argon live-config.hostname=argon noapic noapm nodma nomce nolapic nomodeset nosplash vga=normal

label live-argon-toram
    menu label Start Argon OS (load to ^RAM, run without the USB)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash username=argon hostname=argon live-config.username=argon live-config.hostname=argon apparmor=1 security=apparmor toram
