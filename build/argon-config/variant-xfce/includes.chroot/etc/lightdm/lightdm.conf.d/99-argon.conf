# Argon OS — display manager policy
[Seat:*]
# Show the user on the login screen (one-click login). If autologin ever
# doesn't fire, the argon user is right there to click — no "Other…" and no
# typing an unknown username, which was a real source of confusion.
greeter-hide-users=false
# No guest sessions
allow-guest=false
# Default session for MANUAL logins: XFCE on X11, explicitly.
#
# This must be pinned. Argon also ships an experimental Wayland session
# (labwc) in /usr/share/wayland-sessions; without this line LightDM picks
# the default itself and can land on that session. labwc fails to start on
# plenty of hardware and in VMs, and a session that dies immediately drops
# the user straight back to the greeter — which is indistinguishable from
# "my password was rejected". XFCE stays the default; Wayland remains
# selectable from the session menu for anyone who wants it.
user-session=xfce
