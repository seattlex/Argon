# Argon OS — live session autologin (static, no boot script needed).
#
# The 'argon' user is baked into the image with a real password, so this
# just tells LightDM to log it in automatically. On INSTALLED systems the
# Calamares removeuser + shellprocess steps delete the 'argon' user and
# this file, and the installer configures login for your real account.
[Seat:*]
autologin-user=argon
autologin-user-timeout=0
autologin-session=xfce
