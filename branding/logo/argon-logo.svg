<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Argon OS logo — bold arrowhead "A" with a swoosh base, on a dark
       rounded square. Palette: near-black #0B1220, ice blue #88A5C8. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5E81AC"/>
      <stop offset="1" stop-color="#ECEFF4"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- left blade (white), right blade (subtle ice gradient), swoosh base -->
  <polygon points="256,78 86,438 210,438" fill="#ECEFF4"/>
  <polygon points="256,78 426,438 302,438" fill="url(#peak)"/>
  <path d="M212 414 Q256 358 300 414 Q256 390 212 414 Z" fill="#ECEFF4"/>
</svg>
