<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- Argon OS default wallpaper — "Nordfjell"
       Dark Nordic night sky over layered geometric mountains. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#14213A"/>
      <stop offset="1" stop-color="#1E3251"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3D5C"/>
      <stop offset="1" stop-color="#22304A"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22304A"/>
      <stop offset="1" stop-color="#182338"/>
    </linearGradient>
    <linearGradient id="ridge3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131D30"/>
      <stop offset="1" stop-color="#0D1524"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5E81AC" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5E81AC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#ECEFF4">
    <circle cx="320" cy="240" r="3" opacity="0.7"/>
    <circle cx="760" cy="140" r="2" opacity="0.5"/>
    <circle cx="1180" cy="320" r="2.5" opacity="0.6"/>
    <circle cx="1620" cy="180" r="2" opacity="0.45"/>
    <circle cx="2240" cy="260" r="3" opacity="0.65"/>
    <circle cx="2660" cy="120" r="2" opacity="0.5"/>
    <circle cx="3080" cy="340" r="2.5" opacity="0.6"/>
    <circle cx="3480" cy="200" r="2" opacity="0.5"/>
    <circle cx="540" cy="520" r="2" opacity="0.4"/>
    <circle cx="1980" cy="90" r="2" opacity="0.55"/>
    <circle cx="2900" cy="480" r="2" opacity="0.4"/>
    <circle cx="3660" cy="420" r="2.5" opacity="0.5"/>
  </g>

  <!-- Argon "A" mark, faint, centre-high -->
  <g transform="translate(1770,690) scale(0.62)" opacity="0.16" fill="#ECEFF4">
    <polygon points="256,96 296,96 176,416 116,416"/>
    <polygon points="256,96 296,96 396,416 336,416"/>
    <polygon points="208,300 322,300 340,344 190,344"/>
    <circle cx="256" cy="96" r="18"/>
  </g>

  <!-- Mountain ridges, back to front -->
  <polygon fill="url(#ridge1)" points="0,1560 480,1150 900,1460 1380,1020 1860,1440 2300,1120 2760,1480 3260,1080 3840,1500 3840,2160 0,2160"/>
  <polygon fill="url(#ridge2)" points="0,1760 560,1360 1040,1680 1560,1300 2080,1700 2620,1380 3160,1720 3840,1360 3840,2160 0,2160"/>
  <polygon fill="url(#ridge3)" points="0,1980 640,1660 1240,1920 1900,1620 2520,1940 3120,1680 3840,1960 3840,2160 0,2160"/>
</svg>
