<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Argon OS logo: geometric Nordic "A".
       Palette: deep blue #16233A, slate #4C566A, ice blue #88A5C8, white #ECEFF4 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2B47"/>
      <stop offset="1" stop-color="#101A2C"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5E81AC"/>
      <stop offset="1" stop-color="#88A5C8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Geometric A: two angular strokes forming a peak, split crossbar -->
  <g stroke-linejoin="miter" stroke-linecap="butt">
    <!-- left stroke -->
    <polygon points="256,96 296,96 176,416 116,416" fill="#ECEFF4"/>
    <!-- right stroke -->
    <polygon points="256,96 296,96 396,416 336,416" fill="url(#peak)"/>
    <!-- crossbar, offset like a mountain shelf -->
    <polygon points="208,300 322,300 340,344 190,344" fill="#4C566A"/>
  </g>

  <!-- Atomic nod: single electron orbit dot (Argon, element 18) -->
  <circle cx="256" cy="96" r="18" fill="#ECEFF4"/>
</svg>
