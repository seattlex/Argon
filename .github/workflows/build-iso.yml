name: Build ISO

on:
  # Manual, on-demand builds from the Actions tab (available once this
  # workflow is on the default branch).
  workflow_dispatch:
    inputs:
      variant:
        description: "Desktop variant"
        default: "xfce"
        required: true
  # Release builds: pushing a version tag produces a signed GitHub Release.
  push:
    tags:
      - "v*"
  # Weekly rolling snapshot, Monday 03:00 UTC.
  schedule:
    - cron: "0 3 * * 1"

# NOTE: the ISO build deliberately does NOT run on every push/PR — a full
# build is ~15 minutes and downloads ~2 GB, so running it per-commit is
# wasteful and noisy. Fast checks (shellcheck, config assembly) live in the
# separate Lint workflow, which does run on PRs. To produce an ISO, use the
# "Run workflow" button (after merge to main), push a v* tag, or wait for
# the weekly schedule.

permissions:
  contents: write

# One build per branch/PR; a new push cancels the previous run.
concurrency:
  group: build-iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # live-build needs to create chroots and mount pseudo-filesystems
    container:
      image: kalilinux/kali-rolling
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build git ca-certificates xz-utils \
            build-essential debhelper librsvg2-bin

      - uses: actions/checkout@v4

      - name: Determine version string
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=rolling-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ISO
        run: |
          ./scripts/build-iso.sh \
            --variant "${{ github.event.inputs.variant || 'xfce' }}" \
            --version "${{ steps.version.outputs.version }}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 3

      # NOTE: the multi-GB ISO is deliberately NOT uploaded as a workflow
      # artifact — those count against the account's (small) Actions artifact
      # storage quota and filled it up. Downloads are served from GitHub
      # Releases instead, which use separate, generous release storage:
      #   * a v* tag  -> a permanent versioned release (steps below)
      #   * any other build -> the single, overwritten "rolling" pre-release
      # so ISO storage stays bounded no matter how often the build runs.

      - name: Import release signing key
        if: github.ref_type == 'tag' && vars.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEY: ${{ secrets.ARGON_SIGNING_KEY_ASC }}
        run: |
          apt-get install -y --no-install-recommends gnupg
          printf '%s' "$SIGNING_KEY" | gpg --batch --import

      - name: Sign release artifacts
        if: github.ref_type == 'tag' && vars.HAS_SIGNING_KEY == 'true'
        run: |
          for iso in iso/*.iso; do
            ./scripts/sign-release.sh "$iso"
          done

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Publish immediately when a v* tag is pushed (no manual draft step).
          draft: false
          name: Argon OS ${{ steps.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            iso/*.iso
            iso/*.sha256
            iso/*.sig
          body: |
            ## Argon OS ${{ steps.version.outputs.version }}

            A privacy-first, security-hardened Kali-based Linux distribution (XFCE).

            **Download** the `.iso` below, write it to a USB stick
            (e.g. with [balenaEtcher](https://etcher.balena.io/)), and boot.
            See the [getting-started guide](https://github.com/seattlex/argon/blob/main/docs/getting-started.md).

            ### Verify your download
            ```
            sha256sum -c argon-*-amd64.iso.sha256
            ```
            Signed releases also ship a `.sha256.sig` you can check with
            `gpg --verify argon-*.sha256.sig argon-*.sha256`.

      # --- Rolling snapshot (manual + weekly builds) -----------------------
      # Non-tag builds publish to a single, always-overwritten "rolling"
      # pre-release. Renaming to a stable filename first means each run
      # replaces the previous asset instead of piling up, so this release
      # never holds more than one ISO.
      - name: Stage rolling download
        if: github.ref_type != 'tag' && success()
        run: |
          cd iso
          iso=$(ls *.iso | head -n1)
          mv -f "$iso" argon-rolling-amd64.iso
          rm -f ./*.sha256
          sha256sum argon-rolling-amd64.iso > argon-rolling-amd64.iso.sha256

      - name: Publish rolling snapshot
        if: github.ref_type != 'tag' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Argon OS (rolling snapshot)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            iso/argon-rolling-amd64.iso
            iso/argon-rolling-amd64.iso.sha256
          body: |
            ## Argon OS — rolling snapshot

            Latest automatic build (`${{ steps.version.outputs.version }}`).
            Unversioned and may change at any time; for a stable download use a
            versioned release from the
            [releases page](https://github.com/seattlex/argon/releases).

            **Download** `argon-rolling-amd64.iso`, write it to a USB stick
            (e.g. with [balenaEtcher](https://etcher.balena.io/)), and boot.

            ### Verify your download
            ```
            sha256sum -c argon-rolling-amd64.iso.sha256
            ```
