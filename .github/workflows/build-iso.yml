name: Build ISO

on:
  # Manual, on-demand builds from the Actions tab (available once this
  # workflow is on the default branch).
  workflow_dispatch:
    inputs:
      variant:
        description: "Desktop variant"
        default: "xfce"
        required: true
  # Release builds: pushing a version tag produces a signed GitHub Release.
  push:
    tags:
      - "v*"
  # Weekly rolling snapshot, Monday 03:00 UTC.
  schedule:
    - cron: "0 3 * * 1"

# NOTE: the ISO build deliberately does NOT run on every push/PR — a full
# build is ~15 minutes and downloads ~2 GB, so running it per-commit is
# wasteful and noisy. Fast checks (shellcheck, config assembly) live in the
# separate Lint workflow, which does run on PRs. To produce an ISO, use the
# "Run workflow" button (after merge to main), push a v* tag, or wait for
# the weekly schedule.

permissions:
  contents: write

# One build per branch/PR; a new push cancels the previous run.
concurrency:
  group: build-iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The build runs on the HOST (not inside a `container:`) so this step
      # can reach and delete the host's preinstalled toolchains. A
      # GitHub-hosted runner ships ~30 GB of Android SDK, .NET, GHC, and the
      # hosted-tool cache on the root filesystem, leaving only ~21 GB free —
      # not enough for the Security Edition (kali-linux-default) live-build,
      # which died mid-run with "No space left on device". None of it is
      # used by an apt/live-build image build, so remove it up front.
      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/lib/jvm \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules || true
          sudo docker image prune -af || true
          sudo swapoff -a || true
          echo "After:"; df -h /

      - uses: actions/checkout@v4

      - name: Determine version string
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=rolling-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      # live-build needs a Kali userland and privileges to build chroots and
      # mount pseudo-filesystems, so run it in a Kali container we launch
      # ourselves (rather than a job-level `container:`, which would run this
      # step inside the container and block the disk-cleanup above).
      - name: Build ISO
        env:
          VARIANT: ${{ github.event.inputs.variant || 'xfce' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -e VARIANT -e VERSION \
            kalilinux/kali-rolling bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build git ca-certificates xz-utils \
                build-essential debhelper librsvg2-bin \
                initramfs-tools zstd
              # initramfs-tools+zstd give lsinitramfs its decompressor so
              # build-iso.sh can verify the shipped initramfs (recommends off,
              # and the container has no kernel, so neither is pulled in
              # otherwise).
              git config --global --add safe.directory /work
              ./scripts/build-iso.sh --variant "$VARIANT" --version "$VERSION"
            '
          # Files written inside the container are owned by root; hand them
          # back to the runner user so the release/publish steps below (mv,
          # rm, split, action uploads) can operate on iso/ and build/.
          sudo chown -R "$(id -u):$(id -g)" iso build 2>/dev/null || true

      - name: Upload build log on failure
        if: failure()
        # Never let a failed log upload add a second, unrelated error on top
        # of the real one. The artifact store is small and quota-limited, and
        # a "storage quota has been hit" message here obscures the actual
        # build failure this step exists to help diagnose.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 3

      # NOTE: the multi-GB ISO is deliberately NOT uploaded as a workflow
      # artifact — those count against the account's (small) Actions artifact
      # storage quota and filled it up. Downloads are served from GitHub
      # Releases instead, which use separate, generous release storage:
      #   * a v* tag  -> a permanent versioned release (steps below)
      #   * any other build -> the single, overwritten "rolling" pre-release
      # so ISO storage stays bounded no matter how often the build runs.

      - name: Import release signing key
        if: github.ref_type == 'tag' && vars.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEY: ${{ secrets.ARGON_SIGNING_KEY_ASC }}
        run: |
          # gnupg is preinstalled on the ubuntu-latest host (the build no
          # longer runs in a bare container).
          printf '%s' "$SIGNING_KEY" | gpg --batch --import

      - name: Sign release artifacts
        if: github.ref_type == 'tag' && vars.HAS_SIGNING_KEY == 'true'
        run: |
          for iso in iso/*.iso; do
            ./scripts/sign-release.sh "$iso"
          done

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Publish immediately when a v* tag is pushed (no manual draft step).
          draft: false
          name: Argon OS ${{ steps.version.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            iso/*.iso
            iso/*.sha256
            iso/*.sig
          body: |
            ## Argon OS ${{ steps.version.outputs.version }}

            A privacy-first, security-hardened Kali-based Linux distribution (XFCE).

            **Download** the `.iso` below, write it to a USB stick
            (e.g. with [balenaEtcher](https://etcher.balena.io/)), and boot.
            See the [getting-started guide](https://github.com/seattlex/argon/blob/main/docs/getting-started.md).

            ### Verify your download
            ```
            sha256sum -c argon-*-amd64.iso.sha256
            ```
            Signed releases also ship a `.sha256.sig` you can check with
            `gpg --verify argon-*.sha256.sig argon-*.sha256`.

      # --- Rolling snapshot (manual + weekly builds) -----------------------
      # Non-tag builds publish to a single, always-overwritten "rolling"
      # pre-release. Renaming to a stable filename first means each run
      # replaces the previous asset instead of piling up, so this release
      # never holds more than one ISO.
      - name: Stage rolling download
        if: github.ref_type != 'tag' && success()
        run: |
          cd iso
          rm -f ./*.sha256 ./*.part*
          iso=$(ls *.iso | head -n1)
          # Per-variant asset names so editions coexist on the one rolling
          # release: the xfce edition keeps the historical name, other
          # variants (e.g. security) get their own.
          variant="${{ github.event.inputs.variant || 'xfce' }}"
          if [ "$variant" = "xfce" ]; then
            name=argon-rolling-amd64.iso
          else
            name="argon-${variant}-rolling-amd64.iso"
          fi
          mv -f "$iso" "$name"
          # Checksum of the WHOLE image, split or not — it is what users
          # verify after (re)assembly.
          sha256sum "$name" > "$name.sha256"
          # GitHub release assets cap at 2 GiB per file. The Security
          # Edition exceeds that, so split oversized images into parts the
          # release can hold; the release notes explain reassembly.
          if [ "$(stat -c%s "$name")" -gt 1900000000 ]; then
            split -b 1900M "$name" "$name.part"
            rm -f "$name"
            ls -l ./*.part*
          fi
          # Also publish the argon-apps .deb so scripts/argon-migrate.sh can
          # fetch it to bring older installs up to date. Only from the xfce
          # build (it's desktop-independent; no need to duplicate per edition).
          if [ "$variant" = "xfce" ]; then
            deb=$(ls ../packages/dist/argon-apps_*_all.deb 2>/dev/null | sort -V | tail -n1 || true)
            [ -n "$deb" ] && cp -f "$deb" . && echo "staged $(basename "$deb")"
          fi

      - name: Publish rolling snapshot
        if: github.ref_type != 'tag' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Argon OS (rolling snapshot)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            iso/argon-*rolling-amd64.iso
            iso/argon-*rolling-amd64.iso.sha256
            iso/argon-*rolling-amd64.iso.part*
            iso/argon-apps_*_all.deb
          body: |
            ## Argon OS — rolling snapshot

            Latest automatic build (`${{ steps.version.outputs.version }}`).
            Unversioned and may change at any time; for a stable download use a
            versioned release from the
            [releases page](https://github.com/seattlex/argon/releases).

            **Download** `argon-rolling-amd64.iso`, write it to a USB stick
            (e.g. with [balenaEtcher](https://etcher.balena.io/)), and boot.

            **Security Edition** (`argon-security-…`) images exceed GitHub's
            2 GiB per-file limit and are published as `.partaa`, `.partab`, …
            Download every part, then reassemble:
            ```
            cat argon-security-rolling-amd64.iso.part* > argon-security-rolling-amd64.iso
            ```
            (Windows: `copy /b *.partaa+*.partab argon-security-rolling-amd64.iso`)

            ### Verify your download
            ```
            sha256sum -c argon-rolling-amd64.iso.sha256
            ```
            (For split editions, verify after reassembling.)
